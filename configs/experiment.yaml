experiment:
  name: "representation_subsumption_analysis"
  large_model: "large_model"
  small_model: "small_model"

features:
  large_path: "features/large_features.pt"
  small_path: "features/small_features.pt"
  # Optional: layer-wise features (list of paths)
  large_layers: []
  small_layers: []

linear:
  test_size: 0.2
  random_state: 42
  ridge_alpha: 1.0
  use_ridge: false

geometry:
  knn_k: [5, 10, 20]

cca:
  n_components: 16
  r_values: [4, 8, 16]
  knn_k: [5, 10, 20]
  test_size: 0.2
  random_state: 42
  use_regularized: null   # null = 自動検出 (n < d のとき Regularized CCA を使用)
  lambda_L: 1.0e-3
  lambda_S: 1.0e-3
  standardize: true

output:
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  reports_dir: "results/reports"
